<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live MCQ Test - Recent Job Solution</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f3f6fb;
  color:#172033;
}
header{
  background:linear-gradient(135deg,#075e54,#128c7e);
  color:white;
  padding:22px 15px;
  text-align:center;
}
header h1{margin:0;font-size:24px}
header p{margin:8px 0 0;font-size:14px}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:15px;
  font-size:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 12px #00000012;
  cursor:pointer;
  transition:.2s;
}
.card:hover{transform:translateY(-3px)}
.card h3{margin:0 0 8px}
.card p{color:#666;margin:0 0 15px}
.btn{
  border:0;
  background:#075e54;
  color:white;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-size:15px;
}
.btn.secondary{background:#555}
.btn.danger{background:#c62828}

.question{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #00000012;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  margin:10px 0;
  padding:14px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}
.option:hover{background:#f1f8f7}
.option.correct{
  background:#d8f5df;
  border-color:#159447;
}
.option.wrong{
  background:#ffe0e0;
  border-color:#d32f2f;
}

.explanation{
  background:#eef7ff;
  border-left:4px solid #1976d2;
  padding:12px;
  margin-top:15px;
  border-radius:7px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.badge{
  background:#e7f5f2;
  color:#075e54;
  padding:7px 12px;
  border-radius:20px;
  font-size:14px;
}

.hidden{display:none}

.result{
  background:white;
  padding:30px 20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 3px 12px #00000012;
}
.score{
  font-size:40px;
  font-weight:bold;
  color:#075e54;
}
</style>
</head>

<body>

<header>
  <h1>📚 Live MCQ Test</h1>
  <p>Recent Job Solution • প্রশ্ন • কুইজ • ব্যাখ্যা</p>
</header>

<div class="container">

<!-- HOME -->
<section id="home">
  <h2>স্বাগতম 👋</h2>
  <p>আপনার লক্ষ্যে এগিয়ে যান। পরীক্ষার প্রস্তুতি হোক আরো সহজে।</p>

  <input
    id="search"
    class="search"
    placeholder="🔎 বিভাগ খুঁজুন..."
    oninput="searchCategory()"
  >

  <div id="categories" class="grid"></div>
</section>


<!-- SET PAGE -->
<section id="sets" class="hidden">
  <div class="topbar">
    <h2 id="setTitle"></h2>
    <button class="btn secondary" onclick="goHome()">← ফিরে যান</button>
  </div>

  <div id="setList" class="grid"></div>
</section>


<!-- QUIZ -->
<section id="quiz" class="hidden">

  <div class="topbar">
    <span id="quizTitle"></span>
    <span class="badge" id="progress"></span>
  </div>

  <div id="questionBox"></div>

  <button id="nextBtn" class="btn hidden" onclick="nextQuestion()">
    পরের প্রশ্ন →
  </button>

</section>


<!-- RESULT -->
<section id="result" class="hidden">
  <div class="result">
    <h2>🎉 পরীক্ষা শেষ</h2>

    <div class="score" id="finalScore">0</div>

    <p id="resultText"></p>

    <button class="btn" onclick="retryQuiz()">
      🔄 আবার পরীক্ষা দিন
    </button>

    <button class="btn secondary" onclick="goHome()">
      🏠 হোম
    </button>
  </div>
</section>

</div>


<script>

/* =====================================================

===================================================== */

    }
  ],

  bank1: [

      q:"বাংলাদেশের কেন্দ্রীয় ব্যাংকের নাম কী?",
      options:[
        "সোনালী ব্যাংক",

      options:[

      ],
      answer:1,
      explanation:"বাংলাদেশ ব্যাংক বাংলাদেশের কেন্দ্রীয় ব্যাংক।"

  noncadre1: [
    {

      options:[
        "লুই আই কান",

        "মুজহারুল ইসলাম",

      ],
      answer:0,
      explanation:"জাতীয় সংসদ ভবনের স্থপতি লুই আই কান।"
    }
  ],

  grade1: [
    {
      q:"‘Honesty is the best policy’ বাক্যে Honesty কোন পদ?",
      options:["Verb","Adjective","Noun","Adverb"],
      answer:2,
      explanation:"Honesty একটি Abstract Noun।"
    }
  ],

    {
      q:"2 + 3 × 4 = কত?",
      options:["20","14","24","10"],
      answer:1,
      explanation:"BODMAS অনুযায়ী আগে গুণ: 3×4=12; তারপর 2+12=14।"

      options:["কলম","বই","খাতা","টেবিল"],

      explanation:"Book = বই।"

  current1: [
    {

      options:["সঠিক","ভুল","কোনোটিই নয়","জানা নেই"],
      answer:0,
      explanation:"এই অংশটি নিয়মিত আপডেট করার জন্য রাখা হয়েছে।"

};


/* =====================================================
   CATEGORY DATA
===================================================== */

const CATEGORIES = [

  {
    id:"bcs",
    title:"৫০তম–১০ম BCS",
    icon:"🏛️",
    description:"BCS প্রশ্ন সমাধান ও ব্যাখ্যা",
    sets:createBCSSets()
  },

  {
    id:"primary",
    title:"Primary + Headmaster",
    icon:"🏫",
    description:"প্রাইমারি নিয়োগ প্রশ্ন সমাধান",
    sets:createPrimarySets()
  },

  {
    id:"ntrca",
    title:"NTRCA ১ম–১৯তম",
    icon:"👨‍🏫",
    description:"শিক্ষক নিবন্ধন প্রশ্ন সমাধান",
    sets:createNTRCASets()
  },

  {
    id:"bank",
    title:"Bank Job",
    icon:"🏦",
    description:"ব্যাংক নিয়োগ প্রশ্ন",
    sets:createSets("bank","Bank",10)
  },

  {
    id:"bb",
    title:"Bangladesh Bank",
    icon:"🏛️",
    description:"বাংলাদেশ ব্যাংক নিয়োগ",
    sets:createSets("bb","Bangladesh Bank",10)
  },

  {
    id:"noncadre",
    title:"Non-Cadre",
    icon:"📑",
    description:"নন-ক্যাডার নিয়োগ প্রস্তুতি",
    sets:createSets("noncadre","Non-Cadre",10)
  },

  {
    id:"grade",
    title:"১১–২০ গ্রেড",
    icon:"📚",
    description:"১১–২০ গ্রেড চাকরি প্রস্তুতি",
    sets:createSets("grade","১১–২০ গ্রেড",10)
  },

  {
    id:"model",
    title:"BCS Preliminary Model Test",
    icon:"📝",
    description:"মডেল টেস্ট",
    sets:createSets("model","Model Test",10)
  },

  {
    id:"daily",
    title:"Daily Quiz",
    icon:"⚡",
    description:"প্রতিদিনের কুইজ",
    sets:createSets("daily","Daily Quiz",10)
  },

  {
    id:"current",
    title:"Current Affairs",
    icon:"📰",
    description:"সাম্প্রতিক বিষয়াবলি",
    sets:createSets("current","Current Affairs",10)
  },

  {
    id:"dictionary",
    title:"Offline Dictionary",
    icon:"📖",
    description:"English → Bangla",
    sets:createSets("dictionary","Dictionary",10)
  }

];


/* =====================================================
   CREATE SETS
===================================================== */

function createSets(prefix,name,total){

  const arr=[];

  for(let i=1;i<=total;i++){

    arr.push({
      id:prefix+i,
      name:name+" Set "+i,
      questions:QUESTION_BANK[prefix+i] || []
    });

  }

  return arr;
}


function createBCSSets(){

  const arr=[];

  for(let i=50;i>=10;i--){

    arr.push({
      id:"bcs"+i,
      name:i+"তম BCS",
      questions:QUESTION_BANK["bcs"+i] || []
    });

  }

  return arr;
}


function createPrimarySets(){

  const arr=[];

  for(let i=1;i<=20;i++){

    arr.push({
      id:"primary"+i,
      name:"Primary Set "+i,
      questions:QUESTION_BANK["primary"+i] || []
    });

  }

  return arr;
}


function createNTRCASets(){

  const arr=[];

  for(let i=19;i>=1;i--){

    arr.push({
      id:"ntrca"+i,
      name:i+"তম NTRCA",
      questions:QUESTION_BANK["ntrca"+i] || []
    });

  }

  return arr;
}


/* =====================================================
   VARIABLES
===================================================== */

let currentCategory=null;
let currentSet=null;
let currentQuestions=[];
let currentIndex=0;
let score=0;
let answered=false;


/* =====================================================
   HOME
===================================================== */

function renderCategories(){

  const box=document.getElementById("categories");

  box.innerHTML="";

  CATEGORIES.forEach(cat=>{

    const div=document.createElement("div");

    div.className="card";

    div.dataset.name=(
      cat.title+" "+cat.description
    ).toLowerCase();

    div.innerHTML=`
      <h3>${cat.icon} ${cat.title}</h3>
      <p>${cat.description}</p>
      <button class="btn">
        শুরু করুন →
      </button>
    `;

    div.onclick=()=>showSets(cat);

    box.appendChild(div);

  });

}


function searchCategory(){

  const text=
    document.getElementById("search")
    .value
    .toLowerCase();

  document.querySelectorAll("#categories .card")
    .forEach(card=>{

      card.style.display=
        card.dataset.name.includes(text)
        ?"block"
        :"none";

    });

}


/* =====================================================
   SET PAGE
===================================================== */

function showSets(category){

  currentCategory=category;

  hideAll();

  document.getElementById("sets")
    .classList.remove("hidden");

  document.getElementById("setTitle")
    .innerText=category.icon+" "+category.title;

  const box=document.getElementById("setList");

  box.innerHTML="";

  category.sets.forEach(set=>{

    const div=document.createElement("div");

    div.className="card";

    const count=set.questions.length;

    div.innerHTML=`
      <h3>${set.name}</h3>
      <p>
        ${count>0
          ?count+"টি প্রশ্ন প্রস্তুত"
          :"এখনও প্রশ্ন যোগ করা হয়নি"}
      </p>

      <button
        class="btn"
        ${count===0?"disabled":""}>
        ${count===0?"Coming Soon":"পরীক্ষা দিন →"}
      </button>
    `;

    if(count>0){
      div.onclick=()=>startQuiz(set);
    }

    box.appendChild(div);

  });

}


/* =====================================================
   START QUIZ
===================================================== */

function startQuiz(set){

  currentSet=set;

  currentQuestions=[
    ...set.questions
  ];

  currentIndex=0;
  score=0;
  answered=false;

  hideAll();

  document.getElementById("quiz")
    .classList.remove("hidden");

  document.getElementById("quizTitle")
    .innerText=set.name;

  showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

  answered=false;

  const q=currentQuestions[currentIndex];

  document.getElementById("progress")
    .innerText=
    `${currentIndex+1} / ${currentQuestions.length}`;

  const box=document.getElementById("questionBox");

  box.innerHTML=`

    <div class="question">

      <h3>
        ${currentIndex+1}. ${q.q}
      </h3>

      <div id="options"></div>

      <div id="explanation"></div>

    </div>
  `;

  const options=
    document.getElementById("options");

  q.options.forEach((option,index)=>{

    const btn=document.createElement("button");

    btn.className="option";

    btn.innerText=
      String.fromCharCode(65+index)+". "+option;

    btn.onclick=()=>checkAnswer(index);

    options.appendChild(btn);

  });

  document.getElementById("nextBtn")
    .classList.add("hidden");

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(selected){

  if(answered)return;

  answered=true;

  const q=currentQuestions[currentIndex];

  const buttons=
    document.querySelectorAll(".option");

  buttons.forEach((btn,index)=>{

    btn.disabled=true;

    if(index===q.answer){

      btn.classList.add("correct");

    }

    if(index===selected && selected!==q.answer){

      btn.classList.add("wrong");

    }

  });

  if(selected===q.answer){

    score++;

  }

  document.getElementById("explanation")
    .innerHTML=`
      <div class="explanation">
        <b>✅ সঠিক উত্তর:</b>
        ${q.options[q.answer]}
        <br><br>
        <b>💡 ব্যাখ্যা:</b>
        ${q.explanation}
      </div>
    `;

  document.getElementById("nextBtn")
    .classList.remove("hidden");

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

  currentIndex++;

  if(currentIndex>=currentQuestions.length){

    showResult();

  }else{

    showQuestion();

  }

}


/* =====================================================
   RESULT
===================================================== */

function showResult(){

  hideAll();

  document.getElementById("result")
    .classList.remove("hidden");

  const total=currentQuestions.length;

  const percentage=
    Math.round((score/total)*100);

  document.getElementById("finalScore")
    .innerText=
    `${score} / ${total}`;

  document.getElementById("resultText")
    .innerHTML=
    `আপনার স্কোর: <b>${percentage}%</b><br>
     সঠিক উত্তর: ${score}<br>
     ভুল উত্তর: ${total-score}`;

  localStorage.setItem(
    "lastScore",
    JSON.stringify({
      score:score,
      total:total,
      set:currentSet.name
    })
  );

}


/* =====================================================
   RETRY
===================================================== */

function retryQuiz(){

  startQuiz(currentSet);

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  hideAll();

  document.getElementById("home")
    .classList.remove("hidden");

}


/* =====================================================
   HIDE ALL
===================================================== */

function hideAll(){

  document.querySelectorAll("section")
    .forEach(section=>{
      section.classList.add("hidden");
    });

}


/* =====================================================
   START
===================================================== */

renderCategories();

</script>

</body>
</html>
