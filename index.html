<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Master BD</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:10px}.card{background:#fff;padding:15px;border-radius:12px;max-width:500px;margin:10px auto}.btn{width:100%;padding:12px;background:#1769aa;color:#fff;border:0;border-radius:8px;margin:5px 0}</style></head><body>
<div class="card"><h2>Job Master BD - 400 Set</h2><small>Bangla 100 | English 100 | Math 100 | GK 100</small></div>
<div class="card" id="app">Loading...</div>
<script src="qbank.js"></script>
<script>
function home(){
let used=JSON.parse(localStorage.getItem('usedSets')||'{}');
let h='<h3>বিষয় সিলেক্ট করো</h3>';
['Bangla','English','Math','GK'].forEach(s=>{
h+=`<button class="btn" onclick="location.reload()">${s} - ${(used[s]||[]).length}/100</button>`;
});
document.getElementById('app').innerHTML=h;
}
if(typeof QBANK==='undefined'){document.getElementById('app').innerHTML='qbank.js পাওয়া যায়নি! আবার qbank.js বানাও';}else{home();}
</script></body></html>
