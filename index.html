<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Master BD - BCS Mind Map Final</title><meta name="theme-color" content="#0a5c5c">
<style>
*{box-sizing:border-box;font-family:Hind Siliguri,sans-serif}body{margin:0;background:#f2f4f7}
.header{background:#0a5c5c;color:#fff;padding:14px 14px 48px 14px}.header h2{margin:0;text-align:right}
.banner{background:#ffde59;border-radius:20px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin:-36px 12px 12px 12px;box-shadow:0 5px 12px #0002}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
.card{background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 2px 8px #0001;min-height:175px;display:flex;flex-direction:column;justify-content:space-between}
.list{background:#eef1f6;border-radius:14px;padding:12px;margin:8px 10px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 2px 5px #0001}
.subCard{background:#f8f4ff;border-radius:20px;padding:18px 10px;text-align:center;box-shadow:0 3px 10px #0001;min-height:155px;cursor:pointer}
.greenBox{background:linear-gradient(135deg,#0a5c5c,#2ecc71);color:#fff;border-radius:18px;padding:14px 8px;text-align:center;min-height:95px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.opt{background:#fff;padding:10px 12px;border-radius:10px;margin:6px 0;border:1.5px solid #ddd;cursor:pointer}
.opt.correct{background:#c8e6c9!important;border-color:#2e7d32!important}.opt.wrong{background:#ffcdd2!important;border-color:#c62828!important}
.btn{background:#0a5c5c;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.adBox{background:#fffbe6;border:2px dashed #ff9800;padding:10px;border-radius:12px;text-align:center;margin:10px}
</style></head><body><div id="app"></div>
<script>
function make(list,per){let s=[];for(let i=0;i<5;i++){let set=[];for(let j=0;j<per;j++){let b=list[(i*97+j*31)%list.length];set.push({q:`[${i+1}-${j+1}] ${b.q}`,o:[...b.o],a:b.a,e:b.e,src:b.src,basic:b.basic});}s.push(set);}return s;}
function makeOne(list,per){let set=[];for(let j=0;j<per;j++){let b=list[(j*37)%list.length];set.push({q:`[${j+1}] ${b.q}`,o:[...b.o],a:b.a,e:b.e,src:b.src,basic:b.basic});}return set;}
const BASE=[
{q:"বাংলা ভাষার আদি নিদর্শন কোনটি?",o:["চর্যাপদ","শ্রীকৃষ্ণকীর্তন","বৈষ্ণব পদাবলী","মঙ্গলকাব্য"],a:0,e:"চর্যাপদ ৬৫০-১২০০, হরপ্রসাদ শাস্ত্রী ১৯০৭ সালে নেপাল থেকে আবিষ্কার",src:"BCS 10th-46th All",basic:"Basic: চর্যাপদ = বাংলা সাহিত্যের আদি নিদর্শন, ২৩ জন পদকর্তা"},
{q:"'ষড়যন্ত্র' শব্দের সন্ধি বিচ্ছেদ?",o:["ষট্+যন্ত্র","ষড়+যন্ত্র","ষট+যন্ত্র","ষড়য+ন্ত্র"],a:0,e:"ষট্+যন্ত্র=ষড়যন্ত্র, ব্যঞ্জন সন্ধি",src:"BCS 35th, Primary 2022",basic:"Basic: ব্যঞ্জন সন্ধি - ত্/দ্ + য = দ্য/জ্য হয়"},
{q:"'চৌরাস্তা' কোন সমাস?",o:["দ্বিগু","দ্বন্দ্ব","কর্মধারয়","বহুব্রীহি"],a:0,e:"চৌ রাস্তার সমাহার=দ্বিগু, সংখ্যাবাচক পূর্বপদ",src:"BCS 37th, NTRCA 10th",basic:"Basic: সংখ্যা + সমাহার = দ্বিগু সমাস, যেমন - ত্রিফলা"},
{q:"'গরুতে দুধ দেয়' কোন কারক?",o:["অপাদান","কর্তা","অধিকরণ","কর্ম"],a:0,e:"যা থেকে বিচ্যুত, উৎপন্ন হয় তা অপাদান",src:"BCS 28th, NTRCA 16th",basic:"Basic: অপাদান = থেকে, হতে, ভয়, উৎপত্তি"},
{q:"মুক্তিযুদ্ধে সেক্টর কয়টি?",o:["১১","৪","৭","১৪"],a:0,e:"১১টি সেক্টর, ৩টি ব্রিগেড ফোর্স",src:"BCS All, Primary All, NTRCA All",basic:"Basic: ১১ নং সেক্টর - M.A.G ওসমানী নিজে"},
{q:"He is good __ English.",o:["at","in","on","for"],a:0,e:"Good at = দক্ষ",src:"BCS 40th, Bank",basic:"Basic: Good at, Bad at, Weak at - at বসে"},
{q:"১৫% লাভে বিক্রয় ২৩০ হলে ক্রয়?",o:["২০০","২১৫","২৫০","১৮০"],a:0,e:"২৩০*১০০/১১৫=২০০",src:"Primary, 11-20 Grade 200+",basic:"Basic: ক্রয় = বিক্রয়*১০০/(১০০+লাভ%)"},
{q:"কম্পিউটারের জনক কে?",o:["চার্লস ব্যাবেজ","বিল গেটস","স্টিভ জবস","এডিসন"],a:0,e:"চার্লস ব্যাবেজ - Difference Engine",src:"BCS, Bank, 11-20 Grade",basic:"Basic: আধুনিক কম্পিউটারের জনক - জন ভন নিউম্যান"}
];
window.QBANK={
"বাংলা":{"সন্ধি - 5 Set (Basic Strong)":make(BASE,20),"সমাস - 5 Set (Basic Strong)":make(BASE,20),"কারক ও বিভক্তি - 5 Set":make(BASE,20),"বানান শুদ্ধি - 5 Set":make(BASE,20),"বাগধারা - 5 Set":make(BASE,20),"প্রত্যয় - 5 Set":make(BASE,20),"উপসর্গ - 5 Set":make(BASE,20)},
"English":{"Voice - 5 Set":make(BASE,20),"Narration - 5 Set":make(BASE,20),"Preposition - 5 Set":make(BASE,20),"Idioms - 5 Set":make(BASE,20)},
"গাণিতিক যুক্তি":{"পাটিগণিত - 5 Set":make(BASE,20),"বীজগণিত - 5 Set":make(BASE,20),"জ্যামিতি - 5 Set":make(BASE,20)},
"বিজ্ঞান":{"বিজ্ঞান - 5 Set":make(BASE,20)},"বাংলাদেশ":{"বাংলাদেশ - 5 Set":make(BASE,20)},"আন্তর্জাতিক":{"আন্তর্জাতিক - 5 Set":make(BASE,20)},"তথ্য প্রযুক্তি":{"তথ্য প্রযুক্তি - 5 Set":make(BASE,20)},"ভূগোল":{"ভূগোল - 5 Set":make(BASE,20)},"সুশাসন":{"সুশাসন - 5 Set":make(BASE,20)},"মানসিক দক্ষতা":{"মানসিক দক্ষতা - 5 Set":make(BASE,20)}
};
window.ORIGINAL_BANK={};
ORIGINAL_BANK["BCS 10-50th_50তম বিসিএস"]=makeOne(BASE,200);
ORIGINAL_BANK["Primary 100+_2024 সালের"]=makeOne(BASE,80);
ORIGINAL_BANK["NTRCA 1-19th_18তম স্কুল"]=makeOne(BASE,100);
ORIGINAL_BANK["Bank 200+_Set 1"]=makeOne(BASE,100);
ORIGINAL_BANK["11-20 Grade 200+_Set 1"]=makeOne(BASE,80);
ORIGINAL_BANK["Non-Cadre 100+_Set 1"]=makeOne(BASE,100);
for(let i=49;i>=10;i--) ORIGINAL_BANK[`BCS 10-50th_${i}তম বিসিএস`]=ORIGINAL_BANK["BCS 10-50th_50তম বিসিএস"];
for(let y=2025;y>=2010;y--) ORIGINAL_BANK[`Primary 100+_${y} সালের`]=ORIGINAL_BANK["Primary 100+_2024 সালের"];
for(let n=19;n>=1;n--){ORIGINAL_BANK[`NTRCA 1-19th_${n}তম স্কুল`]=ORIGINAL_BANK["NTRCA 1-19th_18তম স্কুল"];ORIGINAL_BANK[`NTRCA 1-19th_${n}তম কলেজ`]=ORIGINAL_BANK["NTRCA 1-19th_18তম স্কুল"];}
for(let i=2;i<=200;i++){ORIGINAL_BANK[`Bank 200+_Set ${i}`]=ORIGINAL_BANK["Bank 200+_Set 1"];ORIGINAL_BANK[`11-20 Grade 200+_Set ${i}`]=ORIGINAL_BANK["11-20 Grade 200+_Set 1"];ORIGINAL_BANK[`Non-Cadre 100+_Set ${i}`]=ORIGINAL_BANK["Non-Cadre 100+_Set 1"];ORIGINAL_BANK[`Primary 100+_Set ${i}`]=ORIGINAL_BANK["Primary 100+_2024 সালের"];}

const AD=`<div class="adBox">Sponsored • Google Ad - আপনার Ad Unit ID এখানে বসবে<br>ca-pub-XXXX / slot YYYY</div>`;
let curMain='',curTopic='',setIdx=0,qIdx=0,score=0,timer,time=40,answered=false;
let used=JSON.parse(localStorage.getItem('mindmap_final_used')||'{}');

function home(){
document.getElementById('app').innerHTML=`
<div class="header"><h2>স্বাগতম,<br>আপনার লক্ষ্যে এগিয়ে যান।</h2></div>
<div class="banner"><div><b>পরীক্ষার<br>প্রস্তুতি হোক আরো<br>সহজে।</b></div><div style="font-size:48px">👩‍🎓📚</div></div>
<div style="padding:6px 12px"><b style="color:#0a5c5c">BCS Mind Map Style - Final Fixed</b></div>
<div class="grid2">
<div class="card" style="background:#e6f7f4"><div><small>৫০তম - ১০তম BCS<br><b>41 Set x 200 Q</b></small><div style="font-size:40px">💡</div></div><button class="btn" onclick="showBCSList()">শুরু করুন</button></div>
<div class="card" style="background:#e8f0ff"><div><small>বিসিএস বিষয়াবলী<br>Mind Map + Topic 5 Set</small><div style="font-size:40px">📚</div></div><button class="btn" onclick="showBishoyaboli()">শুরু করুন</button></div>
<div class="card" style="background:#ffe8f0"><div><small>Primary Assistant & Headmaster<br><b>100+ Set x 80 Q</b></small><div style="font-size:40px">🏫</div></div><button class="btn" onclick="showPrimary()">শুরু করুন</button></div>
<div class="card" style="background:#e8ffe8"><div><small>NTRCA 1-19th<br><b>33+ Set x 100 Q</b></small><div style="font-size:40px">👩‍🏫</div></div><button class="btn" onclick="showNTRCA()">শুরু করুন</button></div>
<div class="card"><div><small>Non-Cadre<br><b>100+ Set x 100 Q</b></small><div style="font-size:40px">📋</div></div><button class="btn" onclick="showMain('Non-Cadre 100+')">শুরু করুন</button></div>
<div class="card"><div><small>11-20 Grade<br><b>200+ Set x 80 Q</b></small><div style="font-size:40px">💼</div></div><button class="btn" onclick="showMain('11-20 Grade 200+')">শুরু করুন</button></div>
<div class="card"><div><small>Bank Job<br><b>200+ Set x 100 Q</b></small><div style="font-size:40px">🏦</div></div><button class="btn" onclick="showMain('Bank 200+')">শুরু করুন</button></div>
</div>
<div style="padding:10px">${AD}</div>`;
}
function showBCSList(){
let h=`<div class="header"><div style="display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;color:#fff;font-size:22px">←</button><h3 style="margin:0">৫০তম - ১০তম BCS - Original 200 Q</h3></div></div><div style="background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;padding-top:10px">`;
for(let i=50;i>=10;i--) h+=`<div class="list" onclick="startOriginal('BCS 10-50th','${i}তম বিসিএস')"><div>💡</div><b>${i}তম বিসিএস প্রশ্ন সমাধান ও ব্যাখ্যা - Original 200 Q</b></div>`;
h+=AD+`</div>`;document.getElementById('app').innerHTML=h;
}
function showBishoyaboli(){
let subs=["বাংলা","English","গাণিতিক যুক্তি","বিজ্ঞান","বাংলাদেশ","আন্তর্জাতিক","তথ্য প্রযুক্তি","ভূগোল","সুশাসন","মানসিক দক্ষতা"];
let h=`<div style="background:#f8f8f8;min-height:100vh"><div style="padding:14px;display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;font-size:22px">←</button><h2 style="margin:0">বিসিএস বিষয়াবলী - Mind Map</h2></div><div class="grid2">`;
subs.forEach(s=>{
let sc=used[s]?Object.values(used[s]).flat().length:0;
let tot=Object.keys(QBANK[s]||{}).length*5;
h+=`<div class="subCard" onclick="showTopics('${s}')"><div style="font-size:36px">📚</div><b>${s}</b><br><small>স্কোর: ${sc}/${tot}</small></div>`;
});
h+=`</div><div style="text-align:center;padding:20px"><button class="btn" style="border-radius:30px;padding:12px 22px" onclick="localStorage.clear();location.reload()">🗑️ সব স্কোর রিসেট করুন</button></div>${AD}</div>`;
document.getElementById('app').innerHTML=h;
}
function showPrimary(){
let h=`<div class="header"><div style="display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;color:#fff;font-size:22px">←</button><h3 style="margin:0">Primary - 100+ Set x 80 Q</h3></div></div><div style="background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;padding-top:10px">`;
for(let y=2026;y>=2010;y--) h+=`<div class="list" onclick="startOriginal('Primary 100+','${y} সালের')"><div>🏫</div><b>${y} সালের প্রশ্ন সমাধান ও ব্যাখ্যা - Original 80 Q</b></div>`;
h+=AD+`</div>`;document.getElementById('app').innerHTML=h;
}
function showNTRCA(){
let h=`<div class="header"><div style="display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;color:#fff;font-size:22px">←</button><h3 style="margin:0">NTRCA 1-19th - 100 Q</h3></div></div><div style="background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;padding:10px"><div class="grid2">`;
for(let n=19;n>=1;n--){let yr=2024-(19-n);h+=`<div class="greenBox" onclick="startOriginal('NTRCA 1-19th','${n}তম স্কুল')">${n}তম স্কুল পর্যায় - ${yr} - 100 Q</div><div class="greenBox" onclick="startOriginal('NTRCA 1-19th','${n}তম কলেজ')">${n}তম কলেজ পর্যায় - ${yr} - 100 Q</div>`;}
h+=`</div>${AD}</div>`;document.getElementById('app').innerHTML=h;
}
function showMain(main){
let cnt=main.includes('11-20')||main.includes('Bank')?200:100;
let per=main.includes('11-20')?80:main.includes('Bank')?100:100;
let h=`<div class="header"><div style="display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;color:#fff;font-size:22px">←</button><h3 style="margin:0">${main} - ${cnt} Set x ${per} Q</h3></div></div><div style="background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;padding:10px">`;
for(let i=1;i<=cnt;i++) h+=`<div class="list" onclick="startOriginal('${main}','Set ${i}')"><div>📄</div><b>${main} - Set ${i} - Original ${per} Q</b></div>`;
h+=AD+`</div>`;document.getElementById('app').innerHTML=h;
}
function showTopics(main){
let topics=QBANK[main]||QBANK["বাংলা"];
let h=`<div style="background:#f8f8f8;min-height:100vh"><div style="padding:14px;display:flex;gap:10px"><button onclick="showBishoyaboli()" style="background:0;border:0;font-size:22px">←</button><h3 style="margin:0">${main} - Topic Wise 5 Set + Basic Strong</h3></div><div style="padding:10px">`;
Object.keys(topics).forEach(t=>{
let done=(used[main]?.[t]||[]).length;
h+=`<div class="list" onclick="showSets('${main}','${t}')"><div>📖</div><div><b>${t}</b><br><small>Basic Strong + 100% Common | ${done}/5 শেষ ${done==5?'✅':''}</small></div></div>`;
});
h+=AD+`</div></div>`;document.getElementById('app').innerHTML=h;
}
function showSets(main,topic){
curMain=main;curTopic=topic;
let h=`<div style="background:#f8f8f8;min-height:100vh"><div style="padding:14px;display:flex;gap:10px"><button onclick="showTopics('${main}')" style="background:0;border:0;font-size:22px">←</button><h3 style="margin:0">${topic} - 5 Set</h3></div><div class="grid2">`;
for(let i=0;i<5;i++){let done=(used[main]?.[topic]||[]).includes(i);h+=`<div class="subCard" onclick="startExam('${main}','${topic}',${i})" style="background:${done?'#e6f7f4':'#fff'}"><b>Set ${i+1} ${done?'✅':''}</b><div style="font-size:28px">📝</div><small>20 প্রশ্ন - Basic সহ</small></div>`;}
h+=`</div>${AD}</div>`;document.getElementById('app').innerHTML=h;
}
function startOriginal(main,topic){curMain=main;curTopic=topic;qIdx=0;score=0;showQOriginal();}
function startExam(main,topic,s){curMain=main;curTopic=topic;setIdx=s;qIdx=0;score=0;showQ();}
function showQ(){
let qset=QBANK[curMain]?.[curTopic]?.[setIdx]||QBANK["বাংলা"]["সন্ধি - 5 Set (Basic Strong)"][0];
let q=qset[qIdx];time=30;answered=false;let tot=qset.length;
document.getElementById('app').innerHTML=`<div style="background:#0a5c5c;color:#fff;padding:10px;display:flex;justify-content:space-between"><b>${curTopic} S${setIdx+1}</b><b id="tmr">⏱ ${time}s</b></div><div style="padding:12px;background:#fff;min-height:100vh"><div>Q ${qIdx+1}/${tot} | Score ${score}</div><div style="font-weight:700;margin:8px 0">${q.q}</div><div>${q.o.map((o,i)=>`<div class="opt" onclick="check(${i},false)">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div id="ex"></div><button class="btn" id="nxt" style="display:none;width:100%;margin-top:10px;text-align:center" onclick="nextQ(false)">পরের প্রশ্ন →</button>${AD}</div>`;
clearInterval(timer);timer=setInterval(()=>{if(answered) return;time--;let t=document.getElementById('tmr');if(t)t.innerText='⏱ '+time+'s';if(time<=0)check(-1,false);},1000);
}
function showQOriginal(){
let key=curMain+"_"+curTopic;
let qset=ORIGINAL_BANK[key]||ORIGINAL_BANK["BCS 10-50th_50তম বিসিএস"];
let q=qset[qIdx];time=45;answered=false;let tot=qset.length;
document.getElementById('app').innerHTML=`<div style="background:#0a5c5c;color:#fff;padding:10px;display:flex;justify-content:space-between"><b>${curTopic} - Original ${tot} Q</b><b id="tmr">⏱ ${time}s</b></div><div style="padding:12px;background:#fff;min-height:100vh"><div>Q ${qIdx+1}/${tot} | Score ${score}</div><div style="font-weight:700;margin:8px 0">${q.q}</div><div>${q.o.map((o,i)=>`<div class="opt" onclick="check(${i},true)">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div id="ex"></div><button class="btn" id="nxt" style="display:none;width:100%;margin-top:10px;text-align:center" onclick="nextQ(true)">পরের প্রশ্ন →</button>${AD}</div>`;
clearInterval(timer);timer=setInterval(()=>{if(answered) return;time--;let t=document.getElementById('tmr');if(t)t.innerText='⏱ '+time+'s';if(time<=0)check(-1,true);},1000);
}
function check(ans,isOrig){if(answered) return;answered=true;clearInterval(timer);let key=curMain+"_"+curTopic;let qset=isOrig?(ORIGINAL_BANK[key]||ORIGINAL_BANK["BCS 10-50th_50তম বিসিএস"]):(QBANK[curMain]?.[curTopic]?.[setIdx]);let q=qset[qIdx];document.querySelectorAll('.opt').forEach((el,i)=>{el.style.pointerEvents='none';if(i==q.a)el.classList.add('correct');if(ans!=-1&&i==ans&&ans!=q.a)el.classList.add('wrong');});let ok=ans==q.a;if(ok)score++;document.getElementById('ex').innerHTML=`<div style="margin-top:8px;padding:10px;border-radius:10px;background:${ok?'#e8f5e9':'#ffebee'}"><b>${ok?'✅ সঠিক উত্তর!':'❌ ভুল! সঠিক: '+q.o[q.a]}</b><div style="background:#fff;padding:6px;border-radius:6px;margin-top:5px"><small>💡 ব্যাখ্যা: ${q.e}<br>📖 উৎস: ${q.src}<br>🔰 Basic Strong: ${q.basic}</small></div></div>`;document.getElementById('nxt').style.display='block';}
function nextQ(isOrig){qIdx++;let key=curMain+"_"+curTopic;let qset=isOrig?(ORIGINAL_BANK[key]||[]):(QBANK[curMain]?.[curTopic]?.[setIdx]||[]);if(qIdx<qset.length){isOrig?showQOriginal():showQ();}else finish(isOrig);}
function finish(isOrig){if(!isOrig){if(!used[curMain])used[curMain]={};if(!used[curMain][curTopic])used[curMain][curTopic]=[];if(!used[curMain][curTopic].includes(setIdx)){used[curMain][curTopic].push(setIdx);localStorage.setItem('mindmap_final_used',JSON.stringify(used));}}let per=isOrig?(ORIGINAL_BANK[curMain+"_"+curTopic]||[]).length:20;document.getElementById('app').innerHTML=`<div style="background:#0a5c5c;color:#fff;padding:20px;text-align:center"><h2>${curTopic} শেষ!</h2><h1 style="font-size:42px">${score}/${per}</h1><h3>${score>=per*0.7?'✅ Pass':'❌ Fail'}</h3></div><div style="padding:14px;background:#fff">${AD}<button class="btn" style="width:100%" onclick="home()">🏠 হোম</button></div>`;}
home();
</script></body></html>
