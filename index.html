<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live MCQ Test</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Hind Siliguri',sans-serif; box-sizing:border-box}
body{margin:0; background:#f5f0ff; padding:12px}
.header{background:#5e35b1; color:white; padding:15px; border-radius:15px; text-align:center; margin-bottom:15px}
.header h2{margin:0}
.card{background:white; border-radius:16px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,.08); margin-bottom:12px}
.q{font-size:18px; font-weight:600; margin-bottom:14px}
.opt{border:2px solid #ede7f6; border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; font-size:16px}
.opt:active{transform:scale(.98)}
.correct{background:#e8f5e9!important; border-color:#4caf50!important; color:#2e7d32}
.wrong{background:#ffebee!important; border-color:#f44336!important; color:#c62828}
.btn{width:100%; background:#5e35b1; color:white; border:0; padding:14px; border-radius:12px; font-size:17px; font-weight:600}
.top{display:flex; justify-content:space-between; font-weight:600; margin-bottom:10px}
</style>
</head>
<body>

<div class="header">
<h2>🔴 Live MCQ Test</h2>
<p style="margin:5px 0 0">BCS | Primary | NTRCA Model Test</p>
</div>

<div class="top">
<span id="qCount">1 / 5</span>
<span id="score">Score: 0</span>
</div>

<div id="quizBox"></div>
<button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Poroborti ➡️</button>
<div id="final" class="card" style="display:none; text-align:center"></div>

<script>
const quizData = [
{q:"বাংলাদেশের জাতীয় সংসদের আসন কতটি?", o:["৩০০","৩৫০","৩৪৫","৩২৫"], a:0},
{q:"পদ্মা সেতুর দৈর্ঘ্য কত?", o:["৫.৮ কিমি","৬.১৫ কিমি","৬.৫ কিমি","৫.৫ কিমি"], a:1},
{q:"বাংলা একাডেমি প্রতিষ্ঠিত হয় কত সালে?", o:["১৯৫২","১৯৫৫","১৯৬০","১৯৭১"], a:1},
{q:"মুক্তিযুদ্ধে বীরশ্রেষ্ঠ কতজন?", o:["৭ জন","৬ জন","১১ জন","৪ জন"], a:0},
{q:"WHO এর সদর দপ্তর কোথায়?", o:["নিউইয়র্ক","জেনেভা","প্যারিস","লন্ডন"], a:1}
];

let current = 0, score = 0;
const quizBox = document.getElementById("quizBox");
const qCount = document.getElementById("qCount");
const scoreEl = document.getElementById("score");

function loadQuestion(){
qCount.innerText = `${current+1} / ${quizData.length}`;
scoreEl.innerText = `Score: ${score}`;
let q = quizData[current];
quizBox.innerHTML = `<div class="card"><div class="q">${current+1}. ${q.q}</div>${q.o.map((op,i)=>`<div class="opt" onclick="checkAns(this,${i})">${op}</div>`).join('')}</div>`;
document.getElementById("nextBtn").style.display="none";
}

function checkAns(el, idx){
let q = quizData[current];
let all = document.querySelectorAll(".opt");
all.forEach(o=>o.style.pointerEvents="none");
if(idx === q.a){ el.classList.add("correct"); score++; scoreEl.innerText = `Score: ${score}`; }
else{ el.classList.add("wrong"); all[q.a].classList.add("correct"); }
document.getElementById("nextBtn").style.display="block";
}

function nextQuestion(){
current++;
if(current < quizData.length){ loadQuestion(); }
else{ showFinal(); }
}

function showFinal(){
quizBox.innerHTML = "";
document.getElementById("nextBtn").style.display="none";
let finalDiv = document.getElementById("final");
finalDiv.style.display="block";
let msg = score>=4? "🎉 অসাধারণ! আপনি প্রস্তুত!" : score>=2? "👍 ভালো, আরও প্র্যাকটিস করুন" : "💪 আবার চেষ্টা করুন";
finalDiv.innerHTML = `<h2>আপনার স্কোর: ${score}/${quizData.length}</h2><p>${msg}</p><br><button class="btn" onclick="location.reload()">আবার পরীক্ষা দিন</button>`;
}
loadQuestion();
</script>
</body>
</html>
