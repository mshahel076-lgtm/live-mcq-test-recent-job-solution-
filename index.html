<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>100 Real Games - Racing & Action</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;padding-bottom:70px}
.header{background:linear-gradient(90deg,#ff0000,#ff6a00);padding:14px;text-align:center;font-size:20px;font-weight:900;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1e1e1e;border-radius:14px;overflow:hidden;border:1px solid #333;text-align:center}
.card .thumb{height:80px;display:flex;align-items:center;justify-content:center;font-size:50px;background:#000}
.card b{font-size:13px;display:block;padding:6px 0}
.card button{width:90%;margin:0 0 8px 0;padding:9px;background:linear-gradient(90deg,#ff0000,#ff6a00);border:none;color:#fff;border-radius:20px;font-weight:800}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;display:none;flex-direction:column}
canvas{background:#222;margin:auto;display:block}
</style>
</head>
<body>
<div class="header">🔥 100 REAL GAMES - RACING & ACTION 🔥</div>
<div class="grid" id="grid"></div>

<div id="modal">
<div style="display:flex;justify-content:space-between;padding:10px;background:#111"><span id="gName"></span><button onclick="closeG()" style="background:red;color:#fff;border:none;padding:8px 14px;border-radius:6px">X CLOSE</button></div>
<canvas id="cv" width="360" height="520"></canvas>
<div style="display:flex;justify-content:space-around;padding:10px">
<button id="leftBtn" style="padding:15px 30px;background:#333;color:#fff;border:none;border-radius:10px">◀️</button>
<button id="actionBtn" style="padding:15px 30px;background:#ff0000;color:#fff;border:none;border-radius:10px">🔥 ACTION</button>
<button id="rightBtn" style="padding:15px 30px;background:#333;color:#fff;border:none;border-radius:10px">▶️</button>
</div>
</div>

<script>
const G=[
{id:1,name:"Voyonkor Car Racing",icon:"🏎️",type:"racing"},
{id:2,name:"Hollywood Police Chase",icon:"🚓",type:"racing"},
{id:3,name:"Bollywood Bike Racing",icon:"🏍️",type:"racing"},
{id:4,name:"Ghost Train Horror",icon:"🚂",type:"racing"},
{id:5,name:"Zombie Shooter",icon:"🧟",type:"shooter"},
{id:6,name:"Hollywood Action Sniper",icon:"🔫",type:"shooter"},
{id:7,name:"Bollywood Car Drift",icon:"🚗",type:"racing"},
{id:8,name:"Horror Highway",icon:"🛣️",type:"racing"},
];
for(let i=9;i<=100;i++){let t=i%2==0?"racing":"shooter"; G.push({id:i,name:(t=="racing"?"Car Racing Pro ":"Action Shooter ")+i,icon:t=="racing"?"🏎️":"🔫",type:t})}

document.getElementById('grid').innerHTML=G.map(g=>`<div class="card"><div class="thumb">${g.icon}</div><b>${g.name}</b><button onclick="openG(${g.id})">PLAY NOW</button></div>`).join('');

let loop, score=0, carX=150, obs=[], isLeft=false,isRight=false;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), modal=document.getElementById('modal');

function openG(id){
 const g=G.find(x=>x.id==id);
 document.getElementById('gName').innerText=g.name;
 modal.style.display='flex';
 if(g.type=='racing') startRacing();
 else startShooter();
}
function closeG(){modal.style.display='none';clearInterval(loop)}

// --- REAL CAR RACING GAME - আপনার Screenshot এর মত ---
function startRacing(){
 carX=150; score=0; obs=[{x:100,y:-100},{x:200,y:-300}];
 loop=setInterval(()=>{
  ctx.fillStyle="#333"; ctx.fillRect(0,0,360,520);
  // Road
  ctx.fillStyle="#555"; ctx.fillRect(60,0,240,520);
  ctx.fillStyle="#fff"; ctx.fillRect(180,0,4,520);
  // Player Car
  if(isLeft && carX>70) carX-=6;
  if(isRight && carX<260) carX+=6;
  ctx.font="35px Arial"; ctx.fillText("🏎️",carX,450);
  // Enemy Cars
  obs.forEach(o=>{
   o.y+=7; ctx.fillText("🚗",o.x,o.y);
   if(o.y>520){o.y=-100; o.x=70+Math.random()*180; score++}
   if(Math.abs(o.x-carX)<30 && Math.abs(o.y-450)<30){score=0; o.y=-200}
  });
  ctx.fillStyle="#fff"; ctx.fillText("Speed: "+score*10+" KM",10,20);
 },20);
}

// --- SHOOTER GAME ---
function startShooter(){
 let bx=180, enemies=[{x:100,y:50}];
 loop=setInterval(()=>{
  ctx.fillStyle="#000"; ctx.fillRect(0,0,360,520);
  ctx.fillText("🔫",bx,480);
  enemies.forEach(e=>{
   e.y+=2; ctx.fillText("🧟",e.x,e.y);
   if(e.y>520){e.y=0; e.x=Math.random()*300}
  });
  ctx.fillStyle="#fff"; ctx.fillText("Kill: "+score,10,20);
 },20);
 document.getElementById('actionBtn').onclick=()=>{score++;};
}

document.getElementById('leftBtn').ontouchstart=()=>isLeft=true;
document.getElementById('leftBtn').ontouchend=()=>isLeft=false;
document.getElementById('rightBtn').ontouchstart=()=>isRight=true;
document.getElementById('rightBtn').ontouchend=()=>isRight=false;
// PC জন্য
document.getElementById('leftBtn').onmousedown=()=>isLeft=true;
document.getElementById('rightBtn').onmousedown=()=>isRight=true;
document.addEventListener('mouseup',()=>{isLeft=false;isRight=false});
</script>
</body>
</html>
