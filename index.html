<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Master BD</title><style>body{font-family:sans-serif;background:#f0f2f5;margin:0;padding:10px}.card{background:#fff;border-radius:12px;padding:15px;max-width:500px;margin:10px auto;box-shadow:0 2px 10px #0002}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#1769aa;color:#fff;font-size:16px;margin:5px 0;font-weight:700}.opt{background:#f5f5f5;padding:12px;border-radius:8px;margin:6px 0;border:1px solid #ddd}.opt.c{background:#c8e6c9;border-color:green}.opt.w{background:#ffcdd2;border-color:red}.ad{background:#fffbe6;border:2px dashed #ff9800;padding:12px;border-radius:10px;text-align:center;margin:10px 0}</style></head><body>
<div class="card"><h2>Job Master BD - 400 Set</h2><small>Bangla 100 | English 100 | Math 100 | GK 100</small></div>
<div class="card" id="app">Loading qbank...</div>
<script src="qbank.js"></script>
<script>
let cur='',set=0,qi=0,sc=0,tm,time=20;
let used=JSON.parse(localStorage.getItem('usedSets')||'{}');
function adHTML(){return `<div class="ad"><div style="font-size:11px;color:#888">Sponsored Ad • Advertisement</div><b style="color:#d32f2f">🔥 ঘরে বসে মোবাইল দিয়ে আয় করুন</b><p style="font-size:13px;margin:6px 0">দৈনিক ৫০০-১০০০ টাকা, ফ্রি প্রশিক্ষণ</p><button class="btn" style="background:#ff5722;width:auto;padding:10px 20px" onclick="window.open('https://t.me/jobmasterbd','_blank')">এখনই দেখুন →</button><br><button class="btn" style="background:#0088cc;width:auto;padding:8px 15px;margin-top:8px" onclick="window.open('https://t.me/jobmasterbd','_blank')">📢 Join Telegram</button></div>`;}
function home(){
let h=adHTML()+`<h3>বিষয় সিলেক্ট করো</h3>`;
['Bangla','English','Math','GK'].forEach(s=>{h+=`<button class="btn" onclick="startSub('${s}')">${s} - ${(used[s]||[]).length}/100</button>`;});
h+=`<button class="btn" style="background:#666" onclick="localStorage.clear();location.reload()">Reset</button>`+adHTML();
document.getElementById('app').innerHTML=h;
}
function startSub(s){cur=s;if(!used[s])used[s]=[];let a=Array.from({length:100},(_,i)=>i).filter(i=>!used[s].includes(i));if(!a.length){alert('সব শেষ!');return;}set=a[Math.floor(Math.random()*a.length)];qi=0;sc=0;showQ();}
function showQ(){let q=QBANK[cur][set][qi];time=20;document.getElementById('app').innerHTML=`<div style="display:flex;justify-content:space-between"><b>${cur} Set ${set+1}</b><b id="tmr">⏱ ${time}s</b></div><p>প্রশ্ন ${qi+1}/20 | স্কোর ${sc}</p><h3>${q.q}</h3><div>${q.o.map((o,i)=>`<div class="opt" onclick="check(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div id="ex"></div><button class="btn" id="nxt" style="display:none;background:#28a745" onclick="nextQ()">পরের প্রশ্ন →</button>`+adHTML();clearInterval(tm);tm=setInterval(()=>{time--;let el=document.getElementById('tmr');if(el)el.innerText='⏱ '+time+'s';if(time<=0)check(-1)},1000);}
function check(a){clearInterval(tm);let q=QBANK[cur][set][qi];document.querySelectorAll('.opt').forEach((el,i)=>{if(i==q.a)el.classList.add('c');if(i==a&&a!=q.a)el.classList.add('w');el.style.pointerEvents='none';});if(a==q.a)sc++;document.getElementById('ex').innerHTML=`<div style="background:#e3f2fd;padding:10px;border-radius:8px;margin-top:8px"><b>${a==q.a?'✅ সঠিক!':'❌ ভুল!'}</b> উত্তর: ${q.o[q.a]}<br><small>💡 ${q.e}</small></div>`;document.getElementById('nxt').style.display='block';}
function nextQ(){qi++;if(qi<20)showQ();else fin();}
function fin(){if(!used[cur].includes(set)){used[cur].push(set);localStorage.setItem('usedSets',JSON.stringify(used));}let tot=Object.values(used).flat().length;document.getElementById('app').innerHTML=`<h2 style="text-align:center">${cur} শেষ!</h2><h1 style="text-align:center">${sc}/20</h1><h3 style="text-align:center;color:${sc>=12?'green':'red'}">${sc>=12?'✅ Pass':'❌ Fail'}</h3><p style="text-align:center">মোট শেষ: ${tot}/400</p>${adHTML()}<button class="btn" onclick="startSub('${cur}')">পরের সেট →</button><button class="btn" style="background:#666" onclick="home()">🏠 হোম</button>`;}
if(typeof QBANK=='undefined'){document.getElementById('app').innerHTML='qbank.js লোড হয়নি! qbank.js ফাইলটা আছে কিনা চেক করো';}else home();
</script></body></html>
