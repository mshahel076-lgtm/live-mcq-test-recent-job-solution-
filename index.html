<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Master BD - 400 Set</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#222}
.wrap{max-width:650px;margin:auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 2px 6px #0001}
.sub{padding:8px 14px;border-radius:20px;border:1px solid #1769aa;margin:3px;display:inline-block;cursor:pointer;background:#fff;color:#1769aa;font-weight:bold}
.sub.active{background:#1769aa;color:#fff}
.set{padding:7px 9px;border-radius:15px;border:1px solid #ccc;margin:2px;display:inline-block;cursor:pointer;font-size:12px;background:#fff}
.correct{background:#d4edda!important;border-color:#28a745!important}
.wrong{background:#f8d7da!important;border-color:#dc3545!important}
.btn{background:#1769aa;color:#fff;border:0;padding:10px;border-radius:10px;width:100%;font-size:17px;margin-top:8px;cursor:pointer}
.opt{padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;cursor:pointer}
.exp{display:none;margin-top:8px;padding:10px;border-radius:8px;font-size:13px}
.exp.show{display:block}
.ok{background:#e8f5e9}.bad{background:#ffebee}
.adBox{border:1px solid #e0e0e0;background:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h2 style="margin:0">Job Master BD - 400 Set</h2><small>Bangla 100 | English 100 | Math 100 | GK 100</small></div>
<div class="card" id="home"></div>
<div class="card" id="quiz" style="display:none"></div>
<div class="card" id="resCard" style="display:none;text-align:center"><h2 id="resT"></h2><p id="resD"></p><button class="btn" onclick="nextSet()">পরের সেট ➡️</button><button class="btn" style="background:#666" onclick="location.reload()">হোম</button></div>
</div>
<script src="qbank.js"></script>
<script>
let curSub='Bangla',curNum=1,qi=0,sc=0,timer,done=JSON.parse(localStorage.getItem('done400')||'{}');
function render(){let h=`<b>বিষয় বাছাই:</b><br><span class="sub ${curSub=='Bangla'?'active':''}" onclick="switchSub('Bangla')">📚 Bangla 100 Set</span><span class="sub ${curSub=='English'?'active':''}" onclick="switchSub('English')">🇬🇧 English 100 Set</span><span class="sub ${curSub=='Math'?'active':''}" onclick="switchSub('Math')">🔢 Math 100 Set</span><span class="sub ${curSub=='GK'?'active':''}" onclick="switchSub('GK')">🌍 GK 100 Set</span><hr><b>${curSub} - সেট বাছাই (100 টা):</b><br>`;for(let i=1;i<=100;i++){let k=curSub+'_'+i;h+=`<span class="set" style="${done[k]?'background:#d4edda':''}" onclick="startSet(${i})">${done[k]?'✅':''}${i}</span>`}document.getElementById('home').innerHTML=h}
function switchSub(s){curSub=s;render()}
function getSet(sub,n){return window.QBANK[sub][n-1]}
function startSet(n){curNum=n;qi=0;sc=0;document.getElementById('home').style.display='none';document.getElementById('quiz').style.display='block';document.getElementById('resCard').style.display='none';showQ()}
function showQ(){let q=getSet(curSub,curNum)[qi];let time=20;clearInterval(timer);document.getElementById('quiz').innerHTML=`<b>সেট: ${curSub} Set ${curNum} | প্রশ্ন: ${qi+1}/20 | স্কোর: ${sc} | সময়: <span id="tm" style="color:red">${time}</span></b><hr><h3>${qi+1}. ${q.q} [${curSub} S${curNum} Q${qi+1}]</h3>${q.o.map((op,i)=>`<div class="opt" onclick="ans(${i})">${String.fromCharCode(65+i)}. ${op}</div>`).join('')}<div id="exp" class="exp"></div>`;timer=setInterval(()=>{time--;document.getElementById('tm').innerText=time;if(time<=0){clearInterval(timer);ans(-1)}},1000)}
function ans(s){if(window.lock) return; window.lock=true; clearInterval(timer); let q=getSet(curSub,curNum)[qi]; let exp=document.getElementById('exp'); let opts=document.querySelectorAll('.opt'); opts.forEach((o,i)=>{if(i==q.a)o.classList.add('correct'); if(i==s&&s!=q.a)o.classList.add('wrong')}); if(s==q.a){sc++;exp.className='exp show ok';exp.innerHTML=`✅ সঠিক! ${q.e}`}else{exp.className='exp show bad';exp.innerHTML=`❌ ভুল! সঠিক: ${q.o[q.a]}<br>${q.e}`} setTimeout(()=>{window.lock=false; qi++; if(qi<20) showQ(); else finish()},1500)}
function finish(){clearInterval(timer); document.getElementById('quiz').innerHTML=''; let k=curSub+'_'+curNum; done[k]=true; localStorage.setItem('done400',JSON.stringify(done)); document.getElementById('resCard').style.display='block'; document.getElementById('resT').innerHTML=`🎉 ${curSub} Set ${curNum} শেষ!`; document.getElementById('resD').innerHTML=`স্কোর: ${sc}/20<br>${sc>=14?'🌟 Excellent':sc>=10?'✅ Pass':'❌ Fail'}<br>মোট শেষ: ${Object.keys(done).length}/400 সেট<br><br><div class="adBox">🎯 পরের চাকরির আপডেট মিস করতে না চাইলে<br><button class="btn" style="width:auto;padding:8px 20px;margin-top:8px" onclick="window.open('https://t.me/yourchannel','_blank')">Join Telegram Channel</button><br><small style="color:#888">Sponsored</small></div>`; }
function nextSet(){if(curNum<100) startSet(curNum+1); else {document.getElementById('resCard').style.display='none';document.getElementById('home').style.display='block';render()}}
render()
</script>
</body>
</html>
