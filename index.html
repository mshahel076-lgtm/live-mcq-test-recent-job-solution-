<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Real Racing - Earning Game</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#000;overflow:hidden}
canvas{display:block;margin:0 auto;background:#2a2a2a}
#ui{position:fixed;top:0;left:0;width:100%;padding:10px;color:#fff;font-family:sans-serif;display:flex;justify-content:space-between;box-sizing:border-box}
#controls{position:fixed;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 20px;box-sizing:border-box}
.btn{width:70px;height:70px;background:rgba(255,255,255,0.2);border:2px solid #fff;border-radius:50%;color:#fff;font-size:24px}
#menu{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#000,#330000);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10}
#menu button{padding:15px 40px;background:#ff0000;border:none;color:#fff;font-size:18px;font-weight:900;border-radius:30px;margin-top:20px}
</style>
</head>
<body>
<div id="menu">
<h1 style="font-size:40px;margin:0">🏁 REAL RACING</h1>
<p>Hollywood Style Car Racing</p>
<button onclick="startGame()">PLAY NOW - EARNING START</button>
<p style="font-size:12px;color:#aaa;margin-top:20px">প্রতি Race শেষে Ad আসবে - এটাই Earning</p>
<div style="margin-top:15px"><ins class="adsbygoogle" style="display:inline-block;width:320px;height:100px" data-ad-client="ca-pub-3940256099942544" data-ad-slot="6300978111"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
</div>
<div id="ui"><span id="score">0 KM</span><span id="speed">0</span></div>
<canvas id="c" width="400" height="700"></canvas>
<div id="controls"><button class="btn" id="l">◀</button><button class="btn" id="r">▶</button></div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let carX=175, carY=550, speed=0, km=0, enemies=[], left=false,right=false, game=false, anim;

function startGame(){
 document.getElementById('menu').style.display='none';
 game=true; km=0; speed=5; carX=175;
 enemies=[{x:100,y:-200,w:40,h:80,c:"#ff0000"},{x:220,y:-500,w:40,h:80,c:"#00ff00"},{x:150,y:-800,w:40,h:80,c:"#0000ff"}];
 loop();
}

function loop(){
 if(!game) return;
 anim=requestAnimationFrame(loop);
 // Road
 ctx.fillStyle="#1a1a1a"; ctx.fillRect(0,0,400,700);
 ctx.fillStyle="#333"; ctx.fillRect(50,0,300,700);
 // Road lines
 ctx.fillStyle="#fff";
 for(let i=0;i<700;i+=40){ctx.fillRect(198, (i+km*2)%700, 4, 20)}
 // Player Car - Real Shape
 ctx.fillStyle="#fff"; ctx.fillRect(carX,carY,50,90);
 ctx.fillStyle="#ff0000"; ctx.fillRect(carX+5,carY+10,40,70);
 ctx.fillStyle="#000"; ctx.fillRect(carX+8,carY+20,34,15);
 // Move
 if(left && carX>60) carX-=6;
 if(right && carX<290) carX+=6;
 // Enemies
 enemies.forEach(e=>{
  e.y+=speed;
  ctx.fillStyle=e.c; ctx.fillRect(e.x,e.y,e.w,e.h);
  ctx.fillStyle="#000"; ctx.fillRect(e.x+5,e.y+10,e.w-10,20);
  if(e.y>700){e.y=-300-Math.random()*500; e.x=60+Math.random()*220; km+=1}
  // Collision
  if(e.x<carX+50 && e.x+e.w>carX && e.y<carY+90 && e.y+e.h>carY){
   game=false;
   alert("CRASH! Score: "+km+" KM - এখন Interstitial Ad আসবে (Earning)");
   document.getElementById('menu').style.display='flex';
   document.getElementById('menu').innerHTML=`<h1>GAME OVER</h1><h2>${km} KM</h2><button onclick="startGame()">AGAIN PLAY</button><p style="color:#aaa">Ad দেখার পর আবার খেলা শুরু হবে</p>`;
  }
 });
 document.getElementById('score').innerText=km+" KM";
 document.getElementById('speed').innerText=speed*20+" SPEED";
}

document.getElementById('l').ontouchstart=()=>left=true; document.getElementById('l').ontouchend=()=>left=false;
document.getElementById('r').ontouchstart=()=>right=true; document.getElementById('r').ontouchend=()=>right=false;
document.getElementById('l').onmousedown=()=>left=true; document.getElementById('l').onmouseup=()=>left=false;
document.getElementById('r').onmousedown=()=>right=true; document.getElementById('r').onmouseup=()=>right=false;
</script>
</body>
</html>
