<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight School</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#game{width:100vw;height:100vh;background:radial-gradient(circle at center, #222 0%, #000 70%);position:relative}
#player{width:30px;height:30px;background:yellow;border-radius:50%;position:absolute;box-shadow:0 0 20px yellow;left:50%;top:80%}
.key{width:20px;height:20px;background:gold;position:absolute;border-radius:3px;box-shadow:0 0 10px gold}
.ghost{width:50px;height:50px;background:red;position:absolute;border-radius:50% 50% 0 0;display:none;box-shadow:0 0 20px red}
#ui{position:fixed;top:10px;left:10px;font-size:20px;z-index:10}
</style>
</head>
<body>
<div id="ui">Chabi: <span id="score">0/3</span> | Voy paiona!</div>
<div id="game">
 <div id="player"></div>
</div>
<script>
let score=0;
let px=50, py=80;
const game=document.getElementById('game');
function spawnKeys(){
 for(let i=0;i<3;i++){
  let k=document.createElement('div');k.className='key';
  k.style.left=Math.random()*80+'%';k.style.top=Math.random()*60+'%';
  k.onclick=()=>{score++;k.remove();document.getElementById('score').innerText=score+'/3';
   if(score==3){alert('Tumi paliye geso! Tumi Jitse!');location.reload()}
  }
  game.appendChild(k);
 }
}
function spawnGhost(){
 let g=document.createElement('div');g.className='ghost';
 g.style.left=Math.random()*80+'%';g.style.top=Math.random()*50+'%';
 g.style.display='block';game.appendChild(g);
 setTimeout(()=>{
   // JUMP SCARE
   document.body.innerHTML='<h1 style=\"font-size:60px;text-align:center;margin-top:40vh;color:red\">BHOOT DHORE FELSE!</h1>';
   let audio=new Audio('https://www.soundjay.com/misc/sounds/scream-01a.mp3');audio.play();
   setTimeout(()=>location.reload(),2000);
 },1000);
}
spawnKeys();
setInterval(()=>{ if(Math.random()>0.7) spawnGhost(); },3000);

// Player move with touch
document.addEventListener('touchmove',(e)=>{
 px=e.touches[0].clientX/window.innerWidth*100;
 py=e.touches[0].clientY/window.innerHeight*100;
 document.getElementById('player').style.left=px+'%';
 document.getElementById('player').style.top=py+'%';
});
</script>
</body>
</html>
