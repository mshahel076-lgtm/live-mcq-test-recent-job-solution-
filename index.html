<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Racing</title>
<style>
  body{margin:0; background:#111; overflow:hidden; font-family:sans-serif; color:white}
  canvas{display:block; margin:0 auto; background:#333}
  #ui{position:absolute; top:10px; left:50%; transform:translateX(-50%); text-align:center}
  #controls{position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-between; padding:0 20px; box-sizing:border-box}
  .btn{width:80px; height:80px; background:rgba(255,255,255,0.2); border-radius:50%; border:2px solid white; font-size:30px; line-height:80px; text-align:center; user-select:none}
</style>
</head>
<body>
<div id="ui"><h2 id="score">Score: 0</h2><p id="speed">Speed: 0 km/h</p></div>
<canvas id="game" width="400" height="700"></canvas>
<div id="controls">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let carX = 175, score = 0, speed = 5;
let keys = {}, enemies = [];
let gameOver = false;

function spawnEnemy(){
  enemies.push({x: Math.random()*300+20, y: -100, w:50, h:90, speed: 3+Math.random()*3});
}

setInterval(spawnEnemy, 1200);

function update(){
  if(gameOver) return;
  if(keys['ArrowLeft'] || keys['a']) carX -= 7;
  if(keys['ArrowRight'] || keys['d']) carX += 7;
  carX = Math.max(0, Math.min(350, carX));
  
  enemies.forEach(e=>{
    e.y += e.speed + speed*0.1;
    // collision
    if(e.y+ e.h > 600 && e.y < 690 && carX < e.x+e.w && carX+50 > e.x){
      gameOver = true;
      alert('Game Over! Score: '+score);
      location.reload();
    }
  });
  enemies = enemies.filter(e=> e.y < 750);
  score++;
  speed = 5 + score*0.01;
  document.getElementById('score').innerText = 'Score: '+score;
  document.getElementById('speed').innerText = 'Speed: '+Math.floor(speed*20)+' km/h';
}

function drawRoad(){
  ctx.fillStyle = '#444';
  ctx.fillRect(0,0,400,700);
  ctx.fillStyle = '#222';
  ctx.fillRect(50,0,300,700);
  // dashed line
  ctx.strokeStyle = 'white';
  ctx.setLineDash([20,20]);
  ctx.beginPath();
  ctx.moveTo(200,0);
  ctx.lineTo(200,700);
  ctx.stroke();
  ctx.setLineDash([]);
}

function draw(){
  drawRoad();
  // player car
  ctx.fillStyle = '#00d2ff';
  ctx.fillRect(carX, 600, 50, 90);
  ctx.fillStyle = '#fff';
  ctx.fillRect(carX+10, 610, 30, 15);
  
  // enemy cars
  ctx.fillStyle = 'red';
  enemies.forEach(e=>{
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.fillStyle = '#333';
    ctx.fillRect(e.x+5, e.y+10, e.w-10, 15);
    ctx.fillStyle = 'red';
  });
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('keydown', e=> keys[e.key]=true);
window.addEventListener('keyup', e=> keys[e.key]=false);

document.getElementById('left').addEventListener('touchstart', ()=> keys['ArrowLeft']=true);
document.getElementById('left').addEventListener('touchend', ()=> keys['ArrowLeft']=false);
document.getElementById('right').addEventListener('touchstart', ()=> keys['ArrowRight']=true);
document.getElementById('right').addEventListener('touchend', ()=> keys['ArrowRight']=false);
</script>
</body>
</html>
