<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>100 Voyonkor Games</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;padding-bottom:70px}
.header{background:linear-gradient(90deg,#ff0000,#8b0000);padding:16px;text-align:center;font-size:20px;font-weight:900;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.game{background:#1a1a1a;border-radius:12px;padding:12px;text-align:center;border:1px solid #333}
.game button{width:100%;padding:10px;margin-top:8px;background:#ff0000;color:#fff;border:none;border-radius:8px;font-weight:700}
#gameModal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99;display:none;flex-direction:column}
#gameCanvas{background:#111;margin:auto;display:block;border:2px solid #ff0000}
.topBar{padding:10px;background:#1a1a1a;display:flex;justify-content:space-between}
.ad{position:fixed;bottom:0;left:0;width:100%;background:#000;text-align:center;padding:5px 0;border-top:1px solid #333;z-index:20}
</style>
</head>
<body>
<div class="header">💀 100 VOYONKOR GAMES 💀</div>
<div class="grid" id="grid"></div>
<div class="ad"><ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-3940256099942544" data-ad-slot="6300978111"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>

<div id="gameModal">
 <div class="topBar"><span id="gameTitle"></span><button onclick="closeGame()" style="background:#ff0000;color:#fff;border:none;padding:8px 12px;border-radius:5px">X CLOSE</button></div>
 <canvas id="gameCanvas" width="320" height="480"></canvas>
 <p style="text-align:center;color:#aaa">Tap / Swipe to Play</p>
</div>

<script>
const games=[
 {id:1,name:"Horror Maze",icon:"👹", type:"maze"},
 {id:2,name:"Ghost Jump",icon:"👻", type:"jump"},
 {id:3,name:"Zombie Shooter",icon:"🧟", type:"shooter"},
 {id:4,name:"Haunted Dodge",icon:"🏚️", type:"dodge"},
];
for(let i=5;i<=100;i++)games.push({id:i,name:"Voyonkor Game "+i,icon:"💀", type:"jump"});

document.getElementById('grid').innerHTML=games.map(g=>`
 <div class="game"><div style="font-size:40px">${g.icon}</div><b>${g.name}</b><button onclick="playGame(${g.id})">PLAY</button></div>
`).join('');

let playCount=0, gameLoop;
const modal=document.getElementById('gameModal'), canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');

function playGame(id){
 playCount++;
 // Earning Point - প্রতি 2 টা গেম পর পর Ad
 if(playCount%2==0){
  // এখানে Interstitial Ad Show হবে
  console.log("Interstitial Ad - Earning");
 }
 const g=games.find(x=>x.id==id);
 document.getElementById('gameTitle').innerText=g.name;
 modal.style.display='flex';
 if(g.type=='jump') startJumpGame();
 if(g.type=='maze') startMazeGame();
 if(g.type=='dodge') startDodgeGame();
 if(g.type=='shooter') startShooterGame();
}
function closeGame(){
 modal.style.display='none';
 clearInterval(gameLoop);
}

// --- GAME 2: Ghost Jump (আপনার Screenshot এর গেম) ---
let playerY, velocity, score, obstacles;
function startJumpGame(){
 playerY=200; velocity=0; score=0; obstacles=[{x:320,y:350}];
 gameLoop=setInterval(()=>{
  ctx.clearRect(0,0,320,480);
  // BG
  ctx.fillStyle="#111"; ctx.fillRect(0,0,320,480);
  // Player Ghost
  velocity+=0.6; playerY+=velocity;
  if(playerY>400) playerY=400;
  ctx.font="30px Arial"; ctx.fillText("👻",20,playerY);
  // Obstacles
  obstacles.forEach(o=>{
   o.x-=4; ctx.fillStyle="#ff0000"; ctx.fillRect(o.x,o.y,20,80);
   if(o.x<50 && o.x>10 && playerY>o.y-30 && playerY<o.y+80){ score=0; obstacles=[{x:320,y:Math.random()*300+100}]; }
   if(o.x<-20){ o.x=320; o.y=Math.random()*300+100; score++; }
  });
  ctx.fillStyle="#fff"; ctx.fillText("Score: "+score,10,20);
  // Click to jump
  canvas.onclick=()=>{velocity=-10}
 },20);
}
function startMazeGame(){ ctx.clearRect(0,0,320,480); ctx.fillStyle="#fff"; ctx.fillText("Horror Maze - Use finger to move 👹",20,240); }
function startDodgeGame(){ startJumpGame(); }
function startShooterGame(){ startJumpGame(); }
</script>
</body>
</html>
