function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function makeOneNoRepeat(pool,count){
let shuffled=shuffle(pool);
let result=[];
let usedQ=new Set();
for(let i=0;i<count;i++){
let idx=i%shuffled.length;
let attempts=0;
while(usedQ.has(shuffled[idx].q) && attempts<shuffled.length){idx=(idx+1)%shuffled.length;attempts++;}
usedQ.add(shuffled[idx].q);
let b=shuffled[idx];
result.push({q:`[${i+1}] ${b.q}`,o:[...b.o],a:b.a,e:b.e,src:b.src,basic:b.basic});
if(i>=shuffled.length-1){shuffled=shuffle(pool);} // নতুন shuffle
}
return result;
}

function showPrimary(){let h=`<div class="header"><div style="display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;color:#fff;font-size:22px">←</button><h3 style="margin:0">Primary 100+ Set x 80 Q Original No Repeat</h3></div></div><div style="background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;padding-top:10px">`;for(let y=2026;y>=2010;y--) h+=`<div class="list" onclick="startOriginal('Primary 100+','${y} সালের')"><div>🏫</div><b>${y} সালের - Original 80 Q No Repeat</b></div>`;h+=AD+`</div>`;document.getElementById('app').innerHTML=h;}
function showNTRCA(){let h=`<div class="header"><div style="display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;color:#fff;font-size:22px">←</button><h3 style="margin:0">NTRCA 1-19th - 100 Q Original No Repeat</h3></div></div><div style="background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;padding:10px"><div class="grid2">`;for(let n=19;n>=1;n--){let yr=2024-(19-n);h+=`<div class="greenBox" onclick="startOriginal('NTRCA 1-19th','${n}তম স্কুল')">${n}তম স্কুল - ${yr} - 100 Q No Repeat</div><div class="greenBox" onclick="startOriginal('NTRCA 1-19th','${n}তম কলেজ')">${n}তম কলেজ - ${yr} - 100 Q No Repeat</div>`;}h+=`</div>${AD}</div>`;document.getElementById('app').innerHTML=h;}
function showMain(main){let cnt=main.includes('11-20')||main.includes('Bank')?200:100;let per=main.includes('11-20')?80:100;let h=`<div class="header"><div style="display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;color:#fff;font-size:22px">←</button><h3 style="margin:0">${main} - ${cnt} Set x ${per} Q Original No Repeat</h3></div></div><div style="background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;padding:10px">`;for(let i=1;i<=cnt;i++) h+=`<div class="list" onclick="startOriginal('${main}','Set ${i}')"><div>📄</div><b>${main} - Set ${i} - Original ${per} Q No Repeat</b></div>`;h+=AD+`</div>`;document.getElementById('app').innerHTML=h;}
function showBishoyaboli(){let subs=["বাংলা","English","গাণিতিক যুক্তি","বিজ্ঞান","বাংলাদেশ","আন্তর্জাতিক","তথ্য প্রযুক্তি","ভূগোল","সুশাসন","মানসিক দক্ষতা"];let h=`<div style="background:#f8f8f8;min-height:100vh"><div style="padding:14px;display:flex;gap:10px"><button onclick="home()" style="background:0;border:0;font-size:22px">←</button><h2 style="margin:0">বিসিএস বিষয়াবলী - Topic Wise 5 Set No Repeat</h2></div><div class="grid2">`;subs.forEach(s=>{let sc=used[s]?Object.values(used[s]).flat().length:0;h+=`<div class="subCard" onclick="showTopics('${s}')"><div style="font-size:32px">📚</div><b>${s}</b><br><small>স্কোর: ${sc}</small></div>`;});h+=`</div><div style="text-align:center;padding:20px"><button class="btn" onclick="localStorage.clear();location.reload()">🗑️ রিসেট</button></div>${AD}</div>`;document.getElementById('app').innerHTML=h;}
function showTopics(main){let topics=QBANK[main]||QBANK["বাংলা"];let h=`<div style="background:#f8f8f8;min-height:100vh"><div style="padding:14px;display:flex;gap:10px"><button onclick="showBishoyaboli()" style="background:0;border:0;font-size:22px">←</button><h3 style="margin:0">${main} - Topic Wise 5 Set No Repeat</h3></div><div style="padding:10px">`;Object.keys(topics).forEach(t=>{let done=(used[main]?.[t]||[]).length;h+=`<div class="list" onclick="showSets('${main}','${t}')"><div>📖</div><div><b>${t}</b><br><small>Basic Strong + No Repeat | ${done}/5 শেষ ${done==5?'✅':''}</small></div></div>`;});h+=AD+`</div></div>`;document.getElementById('app').innerHTML=h;}
function showSets(main,topic){curMain=main;curTopic=topic;let h=`<div style="background:#f8f8f8;min-height:100vh"><div style="padding:14px;display:flex;gap:10px"><button onclick="showTopics('${main}')" style="background:0;border:0;font-size:22px">←</button><h3 style="margin:0">${topic} - 5 Set No Repeat</h3></div><div class="grid2">`;for(let i=0;i<5;i++){let done=(used[main]?.[topic]||[]).includes(i);h+=`<div class="subCard" onclick="startExam('${main}','${topic}',${i})" style="background:${done?'#e6f7f4':'#fff'}"><b>Set ${i+1} ${done?'✅':''}</b><div style="font-size:28px">📝</div><small>20 টি আলাদা Original</small></div>`;}h+=`</div>${AD}</div>`;document.getElementById('app').innerHTML=h;}
function startOriginal(main,topic){curMain=main;curTopic=topic;qIdx=0;score=0;showQOriginal();}
function startExam(main,topic,s){curMain=main;curTopic=topic;setIdx=s;qIdx=0;score=0;showQ();}
function showQ(){let qset=QBANK[curMain]?.[curTopic]?.[setIdx];let q=qset[qIdx];time=30;answered=false;let tot=qset.length;document.getElementById('app').innerHTML=`<div style="background:#0a5c5c;color:#fff;padding:10px;display:flex;justify-content:space-between"><b>${curTopic} S${setIdx+1}</b><b id="tmr">⏱ ${time}s</b></div><div style="padding:12px;background:#fff;min-height:100vh"><div>Q ${qIdx+1}/${tot} | Score ${score}</div><div style="font-weight:700;margin:8px 0">${q.q}</div><div>${q.o.map((o,i)=>`<div class="opt" onclick="check(${i},false)">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div id="ex"></div><button class="btn" id="nxt" style="display:none;width:100%;margin-top:10px" onclick="nextQ(false)">পরের প্রশ্ন →</button>${AD}</div>`;clearInterval(timer);timer=setInterval(()=>{if(answered) return;time--;let t=document.getElementById('tmr');if(t)t.innerText='⏱ '+time+'s';if(time<=0)check(-1,false);},1000);}
function showQOriginal(){let key=curMain+"_"+curTopic;let qset=ORIGINAL_BANK[key]||ORIGINAL_BANK["BCS 10-50th_50তম বিসিএস"];let q=qset[qIdx];time=45;answered=false;let tot=qset.length;document.getElementById('app').innerHTML=`<div style="background:#0a5c5c;color:#fff;padding:10px;display:flex;justify-content:space-between"><b>${curTopic} - Original ${tot} Q No Repeat</b><b id="tmr">⏱ ${time}s</b></div><div style="padding:12px;background:#fff;min-height:100vh"><div>Q ${qIdx+1}/${tot} | Score ${score}</div><div style="font-weight:700;margin:8px 0">${q.q}</div><div>${q.o.map((o,i)=>`<div class="opt" onclick="check(${i},true)">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div id="ex"></div><button class="btn" id="nxt" style="display:none;width:100%;margin-top:10px" onclick="nextQ(true)">পরের প্রশ্ন →</button>${AD}</div>`;clearInterval(timer);timer=setInterval(()=>{if(answered) return;time--;let t=document.getElementById('tmr');if(t)t.innerText='⏱ '+time+'s';if(time<=0)check(-1,true);},1000);}
function check(ans,isOrig){if(answered) return;answered=true;clearInterval(timer);let key=curMain+"_"+curTopic;let qset=isOrig?(ORIGINAL_BANK[key]||ORIGINAL_BANK["BCS 10-50th_50তম বিসিএস"]):(QBANK[curMain]?.[curTopic]?.[setIdx]);let q=qset[qIdx];document.querySelectorAll('.opt').forEach((el,i)=>{el.style.pointerEvents='none';if(i==q.a)el.classList.add('correct');if(ans!=-1&&i==ans&&ans!=q.a)el.classList.add('wrong');});let ok=ans==q.a;if(ok)score++;document.getElementById('ex').innerHTML=`<div style="margin-top:8px;padding:10px;border-radius:10px;background:${ok?'#e8f5e9':'#ffebee'}"><b>${ok?'✅ সঠিক!':'❌ ভুল! সঠিক: '+q.o[q.a]}</b><div style="background:#fff;padding:6px;border-radius:6px;margin-top:5px"><small>💡 ${q.e}<br>📖 ${q.src}<br>🔰 ${q.basic}</small></div></div>`;document.getElementById('nxt').style.display='block';}
function nextQ(isOrig){qIdx++;let key=curMain+"_"+curTopic;let qset=isOrig?(ORIGINAL_BANK[key]||[]):(QBANK[curMain]?.[curTopic]?.[setIdx]||[]);if(qIdx<qset.length){isOrig?showQOriginal():showQ();}else finish(isOrig);}
function finish(isOrig){if(!isOrig){if(!used[curMain])used[curMain]={};if(!used[curMain][curTopic])used[curMain][curTopic]=[];if(!used[curMain][curTopic].includes(setIdx)){used[curMain][curTopic].push(setIdx);localStorage.setItem('final_no_repeat_v2',JSON.stringify(used));}}let per=isOrig?(ORIGINAL_BANK[curMain+"_"+curTopic]||[]).length:20;document.getElementById('app').innerHTML=`<div style="background:#0a5c5c;color:#fff;padding:20px;text-align:center"><h2>${curTopic} শেষ!</h2><h1 style="font-size:42px">${score}/${per}</h1><h3>${score>=per*0.7?'✅ Pass':'❌ Fail'}</h3></div><div style="padding:14px;background:#fff">${AD}<button class="btn" style="width:100%" onclick="home()">🏠 হোম</button></div>`;}
home();
</script></body></html>
